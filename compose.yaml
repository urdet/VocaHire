services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vocahire}
      POSTGRES_USER: ${POSTGRES_USER:-vocahire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init/10-import-vocahire.sh:/docker-entrypoint-initdb.d/10-import-vocahire.sh:ro
      - ./vocahire_full.sql:/seed/vocahire_full.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-vocahire}
      DB_USER: ${POSTGRES_USER:-vocahire}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-value}
      AUDIO_UPLOAD_PATH: /data/uploads/audio
      HF_TOKEN: ${HF_TOKEN:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      HF_HOME: /data/model-cache/huggingface
      TORCH_HOME: /data/model-cache/torch
      WHISPER_CACHE_DIR: /data/model-cache/whisper
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend:ro
      - audio_uploads:/data/uploads
      - model_cache:/data/model-cache
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: frontend/VocaHire
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  postgres_data:
  audio_uploads:
  model_cache:
